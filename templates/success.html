<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload Received</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--navy:#122b63;--gold:#f2b544;--green:#5dbb63;--text:#1f2937;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#f7f9fc 0%,#eef3f9 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .container{max-width:720px;width:100%;background:white;padding:36px;border-radius:28px;box-shadow:0 18px 60px rgba(18,43,99,.12);text-align:center;}
    .logo{max-width:280px;width:100%;margin:0 auto 18px auto;display:block;}
    h1{margin-top:0;color:#126b2f;font-size:32px;}
    p{font-size:18px;line-height:1.5;}
    a{display:inline-block;margin-top:18px;color:var(--navy);font-weight:700;text-decoration:none;}
  </style>
</head>
<body>
  <div class="container">
    <img src="{{ url_for('static', filename='polar_logo.png') }}" class="logo" alt="Po.La.R. Logo">
    <h1>Upload received</h1>
    <p>Thank you. Your file has been uploaded successfully.</p>
    <p>As soon as the transcription is ready, the TXT files will be sent to:</p>
    <p><strong>{{ email }}</strong></p>
    <a href="/">Upload another file</a>
  </div>
</body>
</html>
